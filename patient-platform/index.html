    <!-- FAQPage Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Unified Medical Record?",
          "acceptedAnswer": { "@type": "Answer", "text": "Unified Medical Record is a personal health information platform that applies evidence-based clinical guidelines — from the AHA, ADA, ACC, ESC, USPSTF, and WHO — to your own health data, helping you understand your lab results, blood pressure trends, cancer screening options, and cardiometabolic risk classification." }
        },
        {
          "@type": "Question",
          "name": "Is Unified Medical Record a medical device?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Unified Medical Record is a personal health information tool, not a regulated medical device. It has not been evaluated or approved by any national health authority for clinical or diagnostic use." }
        },
        {
          "@type": "Question",
          "name": "Can Unified Medical Record diagnose medical conditions?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Unified Medical Record classifies your readings against published clinical thresholds for informational purposes only. It does not diagnose, treat, or cure any medical condition. Always consult a qualified healthcare provider for diagnosis and treatment." }
        },
        {
          "@type": "Question",
          "name": "Which clinical guidelines does Unified Medical Record reference?",
          "acceptedAnswer": { "@type": "Answer", "text": "Unified Medical Record references 2025–2026 guidelines from the American Heart Association (AHA), American Diabetes Association (ADA), American College of Cardiology (ACC), European Society of Cardiology (ESC), U.S. Preventive Services Task Force (USPSTF), World Health Organization (WHO), Singapore Ministry of Health, and Malaysia Clinical Practice Guidelines." }
        },
        {
          "@type": "Question",
          "name": "How does Unified Medical Record handle my health data?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your health records are private, secure, and owned entirely by you. Unified Medical Record does not monetise, sell, or share your health data with third parties. You can export or delete your data at any time." }
        },
        {
          "@type": "Question",
          "name": "How are lab results extracted from uploaded reports?",
          "acceptedAnswer": { "@type": "Answer", "text": "When you upload a PDF or photo of your blood test report, Unified Medical Record uses AI to extract test names, values, units, and reference ranges automatically. Extracted values should always be verified against your original report, as document quality can affect accuracy." }
        },
        {
          "@type": "Question",
          "name": "What is the Digital Human Twin?",
          "acceptedAnswer": { "@type": "Answer", "text": "The Digital Human Twin is an experimental feature that computes mathematical risk trajectories for biomarkers like HbA1c, blood pressure, and LDL. It is under active development, has not been validated in clinical trials, and all predictions are informational only." }
        },
        {
          "@type": "Question",
          "name": "Can I share my Unified Medical Record data with my doctor?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Unified Medical Record can generate a structured health summary compiling your self-entered data into a printable document intended to facilitate discussions with your healthcare provider. This summary is not a clinical report or medical record." }
        },
        {
          "@type": "Question",
          "name": "Does Unified Medical Record replace medical advice?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Unified Medical Record is designed to help you understand your health data between consultations. It does not replace professional medical advice, clinical diagnosis, or treatment from a qualified healthcare provider." }
        },
        {
          "@type": "Question",
          "name": "Is Unified Medical Record free to use?",
          "acceptedAnswer": { "@type": "Answer", "text": "Unified Medical Record offers a free tier with access to core features including health measurements, lab result tracking, and cardiometabolic classification. Additional features may be available in future subscription tiers." }
        }
      ]
    }
    </script>
